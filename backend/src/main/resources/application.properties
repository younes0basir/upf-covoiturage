spring.application.name=upf-ride

# PostgreSQL DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5001/upf_ride?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:zoubaa}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}
spring.mvc.async.request-timeout=-1
server.tomcat.connection-timeout=-1

# JWT Configuration
app.jwt.secret=${JWT_SECRET:upfRideSecretKey2025SuperSecureKeyForJWTSigning!}
app.jwt.expiration=86400000

# CORS - allow React dev server and production frontend
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# Email (Resend API - works on Render, no SMTP needed)
app.resend.api-key=${RESEND_API_KEY:placeholder}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# App config
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AI Config (Nvidia NIM / Llama 3.1)
app.ai.nvidia.api-key=${NVIDIA_API_KEY:placeholder}
app.ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
app.ai.nvidia.model=meta/llama-3.1-8b-instruct

# Google Maps (Server-side Geocoding)
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:placeholder}
